spring.application.name=PJT-sales
server.port=${SERVER_PORT:8088}
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@192.168.0.130:1521:HJDB}
spring.datasource.username=${DB_USERNAME:scott}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=5000
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=10000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect
spring.sql.init.mode=never
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5179,https://ekhan-go.github.io}
server.error.include-message=never
server.error.include-stacktrace=never
